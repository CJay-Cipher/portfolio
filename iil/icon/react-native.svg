// pages/cars/[make].tsx - Car make pages (e.g., /cars/toyota)
import { NextSeo } from 'next-seo'
import { GetStaticProps, GetStaticPaths } from 'next'
import Head from 'next/head'

interface MakePageProps {
  make: string
  makeData: {
    totalListings: number
    models: Array<{
      name: string
      count: number
      averagePrice: number
    }>
    priceRange: {
      min: number
      max: number
    }
  }
}

export default function MakePage({ make, makeData }: MakePageProps) {
  const capitalizedMake = make.charAt(0).toUpperCase() + make.slice(1)
  const title = `${capitalizedMake} Cars in Nigeria - Prices & Models`
  const description = `Find all ${capitalizedMake} tokunbo cars in Nigeria. Compare prices across ${makeData.models.length} models from ${makeData.totalListings.toLocaleString()} verified listings. Get expert buying advice.`

  return (
    <>
      <NextSeo
        title={title}
        description={description}
        canonical={`https://tokunbo.io/cars/${make}`}
        openGraph={{
          title,
          description,
          url: `https://tokunbo.io/cars/${make}`,
        }}
      />
      <Head>
        <script
          type="application/ld+json"
          dangerouslySetInnerHTML={{
            __html: JSON.stringify({
              "@context": "https://schema.org",
              "@type": "CollectionPage",
              "name": `${capitalizedMake} Cars in Nigeria`,
              "description": description,
              "url": `https://tokunbo.io/cars/${make}`,
              "mainEntity": {
                "@type": "ItemList",
                "numberOfItems": makeData.models.length,
                "itemListElement": makeData.models.map((model, index) => ({
                  "@type": "ListItem",
                  "position": index + 1,
                  "item": {
                    "@type": "Product",
                    "name": `${capitalizedMake} ${model.name}`,
                    "url": `https://tokunbo.io/cars/${make}/${model.name.toLowerCase()}`,
                    "offers": {
                      "@type": "AggregateOffer",
                      "priceCurrency": "NGN",
                      "offerCount": model.count,
                      "lowPrice": Math.round(model.averagePrice * 0.7),
                      "highPrice": Math.round(model.averagePrice * 1.3)
                    }
                  }
                }))
              }
            })
          }}
        />
      </Head>
      {/* Your make page content */}
    </>
  )
}

export const getStaticPaths: GetStaticPaths = async () => {
  // Fetch all car makes from your API
  const makes = await fetchAllMakes()
  
  const paths = makes.map((make: string) => ({
    params: { make: make.toLowerCase() },
  }))

  return {
    paths,
    fallback: false, // or 'blocking' if you want to generate on-demand
  }
}

export const getStaticProps: GetStaticProps = async ({ params }) => {
  const make = params!.make as string
  const makeData = await fetchMakeData(make)

  if (!makeData) {
    return {
      notFound: true,
    }
  }

  return {
    props: {
      make,
      makeData,
    },
    revalidate: 86400, // Revalidate once per day
  }
}

// pages/cars/[make]/[model].tsx - Car model pages (e.g., /cars/toyota/camry)
import { NextSeo } from 'next-seo'
import { GetStaticProps, GetStaticPaths } from 'next/head'

interface ModelPageProps {
  make: string
  model: string
  modelData: {
    totalListings: number
    averagePrice: number
    years: Array<{
      year: number
      count: number
      averagePrice: number
    }>
    priceRange: {
      min: number
      max: number
    }
  }
}

export default function ModelPage({ make, model, modelData }: ModelPageProps) {
  const capitalizedMake = make.charAt(0).toUpperCase() + make.slice(1)
  const capitalizedModel = model.charAt(0).toUpperCase() + model.slice(1)
  const title = `${capitalizedMake} ${capitalizedModel} Prices in Nigeria`
  const description = `Find ${capitalizedMake} ${capitalizedModel} tokunbo cars in Nigeria. Compare prices from ${modelData.totalListings.toLocaleString()} verified listings across ${modelData.years.length} model years. Average price: ₦${modelData.averagePrice.toLocaleString()}.`

  return (
    <>
      <NextSeo
        title={title}
        description={description}
        canonical={`https://tokunbo.io/cars/${make}/${model}`}
        openGraph={{
          title,
          description,
          url: `https://tokunbo.io/cars/${make}/${model}`,
          images: [
            {
              url: `https://tokunbo.io/cars/${make}/${model}/og-image.jpg`,
              width: 1200,
              height: 630,
              alt: `${capitalizedMake} ${capitalizedModel} in Nigeria`,
            },
          ],
        }}
      />
      <Head>
        <script
          type="application/ld+json"
          dangerouslySetInnerHTML={{
            __html: JSON.stringify({
              "@context": "https://schema.org",
              "@type": "Product",
              "name": `${capitalizedMake} ${capitalizedModel}`,
              "description": description,
              "brand": {
                "@type": "Brand",
                "name": capitalizedMake
              },
              "offers": {
                "@type": "AggregateOffer",
                "priceCurrency": "NGN",
                "lowPrice": modelData.priceRange.min,
                "highPrice": modelData.priceRange.max,
                "offerCount": modelData.totalListings
              },
              "audience": {
                "@type": "Audience",
                "geographicArea": {
                  "@type": "Country",
                  "name": "Nigeria"
                }
              }
            })
          }}
        />
      </Head>
      {/* Your model page content */}
    </>
  )
}

export const getStaticPaths: GetStaticPaths = async () => {
  // Fetch all make/model combinations
  const makeModels = await fetchAllMakeModels()
  
  const paths = makeModels.map((item: { make: string; model: string }) => ({
    params: { 
      make: item.make.toLowerCase(), 
      model: item.model.toLowerCase() 
    },
  }))

  return {
    paths,
    fallback: false,
  }
}

export const getStaticProps: GetStaticProps = async ({ params }) => {
  const make = params!.make as string
  const model = params!.model as string
  const modelData = await fetchModelData(make, model)

  if (!modelData) {
    return {
      notFound: true,
    }
  }

  return {
    props: {
      make,
      model,
      modelData,
    },
    revalidate: 86400,
  }
}

// pages/cars/[make]/[model]/[year].tsx - Specific year pages
import { NextSeo } from 'next-seo'
import { GetStaticProps, GetStaticPaths } from 'next'

interface YearPageProps {
  make: string
  model: string
  year: string
  yearData: {
    totalListings: number
    averagePrice: number
    priceRange: {
      min: number
      max: number
    }
    features: string[]
    bodyTypes: Array<{
      type: string
      count: number
    }>
  }
}

export default function YearPage({ make, model, year, yearData }: YearPageProps) {
  const capitalizedMake = make.charAt(0).toUpperCase() + make.slice(1)
  const capitalizedModel = model.charAt(0).toUpperCase() + model.slice(1)
  const title = `${year} ${capitalizedMake} ${capitalizedModel} Prices in Nigeria`
  const description = `Find ${year} ${capitalizedMake} ${capitalizedModel} tokunbo cars in Nigeria. ${yearData.totalListings.toLocaleString()} verified listings. Average price: ₦${yearData.averagePrice.toLocaleString()}. Price range: ₦${yearData.priceRange.min.toLocaleString()} - ₦${yearData.priceRange.max.toLocaleString()}.`

  return (
    <>
      <NextSeo
        title={title}
        description={description}
        canonical={`https://tokunbo.io/cars/${make}/${model}/${year}`}
        openGraph={{
          title,
          description,
          url: `https://tokunbo.io/cars/${make}/${model}/${year}`,
          images: [
            {
              url: `https://tokunbo.io/cars/${make}/${model}/${year}/og-image.jpg`,
              width: 1200,
              height: 630,
              alt: `${year} ${capitalizedMake} ${capitalizedModel} in Nigeria`,
            },
          ],
        }}
      />
      <Head>
        <script
          type="application/ld+json"
          dangerouslySetInnerHTML={{
            __html: JSON.stringify({
              "@context": "https://schema.org",
              "@type": "Product",
              "name": `${year} ${capitalizedMake} ${capitalizedModel}`,
              "description": description,
              "brand": {
                "@type": "Brand",
                "name": capitalizedMake
              },
              "model": capitalizedModel,
              "productionDate": year,
              "offers": {
                "@type": "AggregateOffer",
                "priceCurrency": "NGN",
                "lowPrice": yearData.priceRange.min,
                "highPrice": yearData.priceRange.max,
                "offerCount": yearData.totalListings
              },
              "additionalProperty": yearData.features.map(feature => ({
                "@type": "PropertyValue",
                "name": "Feature",
                "value": feature
              }))
            })
          }}
        />
      </Head>
      {/* Your year page content */}
    </>
  )
}

export const getStaticPaths: GetStaticPaths = async () => {
  // Fetch all make/model/year combinations
  const makeModelYears = await fetchAllMakeModelYears()
  
  const paths = makeModelYears.map((item: { make: string; model: string; year: string }) => ({
    params: { 
      make: item.make.toLowerCase(), 
      model: item.model.toLowerCase(),
      year: item.year
    },
  }))

  return {
    paths,
    fallback: false,
  }
}

export const getStaticProps: GetStaticProps = async ({ params }) => {
  const make = params!.make as string
  const model = params!.model as string
  const year = params!.year as string
