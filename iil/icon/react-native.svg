import { GetServerSideProps } from 'next'

const Sitemap = () => null

export const getServerSideProps: GetServerSideProps = async ({ res }) => {
  // Fetch all your routes
  const makes = await fetchAllMakes()
  const makeModels = await fetchAllMakeModels()
  const makeModelYears = await fetchAllMakeModelYears()  
  const blogPosts = await fetchAllBlogPosts()

  const sitemap = `<?xml version="1.0" encoding="UTF-8"?>
    <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
      <url>
        <loc>https://tokunbo.io</loc>
        <changefreq>daily</changefreq>
        <priority>1.0</priority>
      </url>
      <url>
        <loc>https://tokunbo.io/blog</loc>
        <changefreq>weekly</changefreq>
        <priority>0.8</priority>
      </url>
      <url>
        <loc>https://tokunbo.io/contact</loc>
        <changefreq>monthly</changefreq>
        <priority>0.5</priority>
      </url>
      ${makes.map((make: string) => `
        <url>
          <loc>https://tokunbo.io/cars/${make}</loc>
          <changefreq>weekly</changefreq>
          <priority>0.9</priority>
        </url>
      `).join('')}
      ${makeModels.map((item: { make: string; model: string }) => `
        <url>
          <loc>https://tokunbo.io/cars/${item.make}/${item.model}</loc>
          <changefreq>weekly</changefreq>
          <priority>0.9</priority>
        </url>
      `).join('')}
      ${makeModelYears.map((item: { make: string; model: string; year: string }) => `
        <url>
          <loc>https://tokunbo.io/cars/${item.make}/${item.model}/${item.year}</loc>
          <changefreq>weekly</changefreq>
          <priority>0.8</priority>
        </url>
      `).join('')}
      ${blogPosts.map((post: { slug: string; updatedAt: string }) => `
        <url>
          <loc>https://tokunbo.io/blog/${post.slug}</loc>
          <lastmod>${post.updatedAt}</lastmod>
          <changefreq>monthly</changefreq>
          <priority>0.7</priority>
        </url>
      `).join('')}
    </urlset>`

  res.setHeader('Content-Type', 'text/xml')
  res.write(sitemap)
  res.end()

  return {
    props: {},
  }
}

export default Sitemap

