// pages/blog/[slug].tsx - Individual blog posts
import { NextSeo, ArticleJsonLd } from 'next-seo'
import { GetStaticProps, GetStaticPaths } from 'next'

interface BlogPostProps {
  post: {
    title: string
    excerpt: string
    content: string
    slug: string
    publishedAt: string
    updatedAt: string
    author: string
    readingTime: number
    tags: string[]
  }
}

export default function BlogPost({ post }: BlogPostProps) {
  return (
    <>
      <NextSeo
        title={post.title}
        description={post.excerpt}
        canonical={`https://tokunbo.io/blog/${post.slug}`}
        openGraph={{
          title: post.title,
          description: post.excerpt,
          url: `https://tokunbo.io/blog/${post.slug}`,
          type: 'article',
          article: {
            publishedTime: post.publishedAt,
            modifiedTime: post.updatedAt,
            authors: [post.author],
            tags: post.tags,
          },
          images: [
            {
              url: `https://tokunbo.io/blog/${post.slug}/og-image.jpg`,
              width: 1200,
              height: 630,
              alt: post.title,
            },
          ],
        }}
      />
      <ArticleJsonLd
        url={`https://tokunbo.io/blog/${post.slug}`}
        title={post.title}
        images={[`https://tokunbo.io/blog/${post.slug}/og-image.jpg`]}
        datePublished={post.publishedAt}
        dateModified={post.updatedAt}
        authorName={post.author}
        publisherName="Tokunbo.io"
        publisherLogo="https://tokunbo.io/logo.png"
        description={post.excerpt}
      />
      {/* Your blog post content */}
    </>
  )
}

export const getStaticPaths: GetStaticPaths = async () => {
  const posts = await fetchAllBlogPosts()
  
  const paths = posts.map((post: { slug: string }) => ({
    params: { slug: post.slug },
  }))

  return {
    paths,
    fallback: false,
  }
}

export const getStaticProps: GetStaticProps = async ({ params }) => {
  const post = await fetchBlogPost(params!.slug as string)

  if (!post) {
    return {
      notFound: true,
    }
  }

  return {
    props: {
      post,
    },
    revalidate: 3600,
  }
}

