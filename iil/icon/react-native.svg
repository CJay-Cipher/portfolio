// Custom 404 Page - pages/404.tsx
import { NextSeo } from 'next-seo'
import Link from 'next/link'
import { useState, useEffect } from 'react'

export default function Custom404() {
  const [searchQuery, setSearchQuery] = useState('')
  const [popularCars] = useState([
    { make: 'toyota', model: 'camry', displayName: 'Toyota Camry' },
    { make: 'honda', model: 'accord', displayName: 'Honda Accord' },
    { make: 'toyota', model: 'corolla', displayName: 'Toyota Corolla' },
    { make: 'lexus', model: 'es', displayName: 'Lexus ES' },
    { make: 'mercedes', model: 'c-class', displayName: 'Mercedes C-Class' },
    { make: 'bmw', model: '3-series', displayName: 'BMW 3 Series' },
  ])

  return (
    <>
      <NextSeo
        title="Page Not Found"
        description="The page you're looking for doesn't exist. Find tokunbo car prices and buying guides on Tokunbo.io."
        canonical="https://tokunbo.io/404"
        noindex={true}
      />
      
      <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center px-4">
        <div className="max-w-2xl w-full text-center">
          {/* 404 Animation */}
          <div className="mb-8">
            <div className="text-8xl font-bold text-indigo-600 mb-4 animate-bounce">
              404
            </div>
            <div className="text-2xl text-gray-700 mb-6">
              Oops! This page took a wrong turn
            </div>
          </div>

          {/* Car illustration or icon */}
          <div className="mb-8">
            <svg 
              className="mx-auto w-32 h-32 text-indigo-400" 
              fill="currentColor" 
              viewBox="0 0 20 20"
            >
              <path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4zM18 9H2v5a2 2 0 002 2h1a3 3 0 006 0h2a3 3 0 006 0h1a2 2 0 002-2V9zM5 13a1 1 0 11-2 0 1 1 0 012 0zm12 0a1 1 0 11-2 0 1 1 0 012 0z" />
            </svg>
          </div>

          <p className="text-gray-600 mb-8 text-lg">
            The car you're looking for might have driven off, but don't worry! 
            We have thousands of other tokunbo cars waiting for you.
          </p>

          {/* Search Section */}
          <div className="mb-8">
            <div className="max-w-md mx-auto">
              <div className="flex rounded-lg shadow-lg">
                <input
                  type="text"
                  placeholder="Search for cars (e.g., Toyota Camry)"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="flex-1 px-4 py-3 rounded-l-lg border-2 border-indigo-300 focus:border-indigo-500 focus:outline-none"
                  onKeyPress={(e) => {
                    if (e.key === 'Enter' && searchQuery.trim()) {
                      window.location.href = `/search?q=${encodeURIComponent(searchQuery.trim())}`
                    }
                  }}
                />
                <button
                  onClick={() => {
                    if (searchQuery.trim()) {
                      window.location.href = `/search?q=${encodeURIComponent(searchQuery.trim())}`
                    }
                  }}
                  className="px-6 py-3 bg-indigo-600 text-white rounded-r-lg hover:bg-indigo-700 transition-colors font-medium"
                >
                  Search
                </button>
              </div>
            </div>
          </div>

          {/* Popular Cars */}
          <div className="mb-8">
            <h3 className="text-lg font-semibold text-gray-800 mb-4">
              Or check out these popular cars:
            </h3>
            <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
              {popularCars.map((car) => (
                <Link
                  key={`${car.make}-${car.model}`}
                  href={`/cars/${car.make}/${car.model}`}
                  className="bg-white rounded-lg px-4 py-3 shadow-md hover:shadow-lg transition-shadow border border-gray-200 hover:border-indigo-300 text-gray-700 hover:text-indigo-600"
                >
                  {car.displayName}
                </Link>
              ))}
            </div>
          </div>

          {/* Navigation Links */}
          <div className="flex flex-wrap justify-center gap-4 mb-8">
            <Link
              href="/"
              className="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition-colors font-medium shadow-lg"
            >
              Go Home
            </Link>
            <Link
              href="/blog"
              className="bg-white text-indigo-600 px-6 py-3 rounded-lg hover:bg-gray-50 transition-colors font-medium shadow-lg border border-indigo-200"
            >
              Read Car Guides
            </Link>
            <Link
              href="/contact"
              className="bg-white text-indigo-600 px-6 py-3 rounded-lg hover:bg-gray-50 transition-colors font-medium shadow-lg border border-indigo-200"
            >
              Contact Us
            </Link>
          </div>

          {/* Fun message */}
          <p className="text-gray-500 text-sm">
            🚗 Don't let this stop your car hunt! Nigeria's best tokunbo deals are just a click away.
          </p>
        </div>
      </div>
    </>
  )
}

