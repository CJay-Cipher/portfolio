<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CJay's Portfolio</title>
    <link rel="canonical" href="https://cjay-portfolio.vercel.app/" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background elements */
        .bg-element {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .bg-element-1 {
            width: 200px;
            height: 200px;
            background: white;
            top: -50px;
            right: -50px;
            animation-delay: 0s;
        }

        .bg-element-2 {
            width: 150px;
            height: 150px;
            background: white;
            bottom: 10%;
            left: 5%;
            animation-delay: 2s;
        }

        .bg-element-3 {
            width: 100px;
            height: 100px;
            background: white;
            top: 50%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(30px);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            padding: 40px 20px;
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo {
            font-size: 60px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .heading {
            color: white;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
            animation: slideUp 0.8s ease-out 0.3s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .description {
            color: rgba(255, 255, 255, 0.85);
            font-size: 18px;
            margin-bottom: 50px;
            line-height: 1.6;
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        .cta-button {
            display: inline-block;
            padding: 16px 50px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid white;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.8s ease-out 0.5s both;
        }

        .cta-button:hover {
            background: transparent;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .cta-button:active {
            transform: translateY(-1px);
        }

        .social-links {
            margin-top: 60px;
            display: flex;
            justify-content: center;
            gap: 20px;
            animation: fadeIn 0.8s ease-out 0.6s both;
        }

        .social-link {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.6;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(10px);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .heading {
                font-size: 36px;
            }

            .description {
                font-size: 16px;
            }

            .cta-button {
                padding: 14px 40px;
                font-size: 15px;
            }

            .logo {
                font-size: 48px;
            }
        }

        @media (max-width: 480px) {
            .heading {
                font-size: 28px;
            }

            .description {
                font-size: 15px;
                margin-bottom: 40px;
            }

            .cta-button {
                padding: 12px 35px;
                font-size: 14px;
            }

            .logo {
                font-size: 40px;
            }

            .social-links {
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background -->
    <div class="bg-element bg-element-1"></div>
    <div class="bg-element bg-element-2"></div>
    <div class="bg-element bg-element-3"></div>

    <!-- Main content -->
    <div class="container">
        <div class="logo-container">
            <div class="subtitle">Welcome</div>
            <div class="logo">CJay</div>
        </div>

        <h1 class="heading">Crafting Digital Excellence</h1>
        <p class="description">Explore my portfolio of innovative projects, design solutions, and web experiences.</p>

        <a href="https://cjay-portfolio.vercel.app/" class="cta-button">Visit My Portfolio</a>

        <!-- Social links (optional) -->
        <div class="social-links">
            <a href="https://github.com/CJay-Cipher" class="social-link" title="GitHub">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

                </svg>
            </a>
            <a href="https://linkedin.com" class="social-link" title="LinkedIn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/>
                </svg>
            </a>
        </div>
    </div>

    <script>
        // Optional: Smooth scroll for any future sections
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
</body>
</html>
